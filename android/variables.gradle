ext {
    // Capacitor 8 baseline. These mirror the defaults in
    // node_modules/@capacitor/android/capacitor/build.gradle — Capacitor
    // supports exactly one SDK level per major version and does not support
    // custom target SDKs, so these track the framework rather than being tuned.
    //
    // minSdkVersion moved 22 -> 24 with Capacitor 8, which drops Android 5.0
    // and 5.1 (Lollipop).
    //
    // targetSdkVersion 36 satisfies Google Play's requirement that new
    // submissions target Android 16 from 31 August 2026.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}
