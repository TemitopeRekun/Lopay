// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13.0 is the version Capacitor 8 pins; it is also the first line
        // that officially supports compileSdk 36 (8.2.1 topped out at 34) and
        // it 16 KB-aligns native libraries by default, which Google Play has
        // required of apps targeting Android 15+ since 1 November 2025.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
