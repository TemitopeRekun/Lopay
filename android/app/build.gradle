apply plugin: 'com.android.application'

// The app version comes from version.json at the repo root — the single source
// of truth shared with the web build (see VERSIONING.md). It is NOT duplicated
// here: a literal versionCode in this file is how the Play listing and the web
// app came to disagree, and `npm run version:check` fails the build if one
// reappears. Bump with `npm run version:bump`.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../version.json'))

// Release signing credentials, in precedence order: android/keystore.properties
// (gitignored, for local builds) then LOPAY_* environment variables (for CI).
// See keystore.properties.example. Neither the keystore nor its passwords are in
// this repo, so a clone alone cannot produce a signed build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String envVar ->
    def value = keystoreProperties.getProperty(key) ?: System.getenv(envVar)
    return value?.trim() ? value : null
}
def storeFilePath = signingValue('storeFile', 'LOPAY_STORE_FILE')
// Signing is configured only when the credentials are actually resolvable AND the
// keystore is really there. A signingConfig pointing at a missing file fails the
// build late and cryptically; without one the build instead succeeds and produces
// app-release-unsigned.apk, which is the honest outcome for a machine that has no
// signing material. The check below makes that case loud rather than silent.
def canSignRelease = storeFilePath != null && file(storeFilePath).exists()

android {
    namespace = "com.lopay.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lopay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.code
        versionName appVersion.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile = file(storeFilePath)
                storePassword = signingValue('storePassword', 'LOPAY_STORE_PASSWORD')
                keyAlias = signingValue('keyAlias', 'LOPAY_KEY_ALIAS')
                keyPassword = signingValue('keyPassword', 'LOPAY_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (canSignRelease) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// An unsigned apk cannot be installed or uploaded, and the only difference between
// it and a real one is a file that is deliberately absent from this repo. Say so at
// build time rather than leaving it to be discovered from the output filename.
if (!canSignRelease) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.endsWith('Release') }) {
            def reason = storeFilePath == null
                ? "no android/keystore.properties and no LOPAY_STORE_FILE in the environment"
                : "storeFile points at ${storeFilePath}, which does not exist"
            logger.lifecycle("WARNING: release builds will be UNSIGNED — ${reason}. " +
                "See android/keystore.properties.example.")
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json is COMMITTED to this repo on purpose (see android/.gitignore).
// It holds no secret — the Android FCM SDK is linked and authenticated from it at
// build time, and it ships inside every APK regardless.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    // Without the file the build still succeeds — it just quietly omits the
    // plugin, and the app then fails `registrationError` on every opt-in and
    // receives not one push. An `info` log is invisible on a release build, so a
    // release is failed outright instead: a total, silent outage of the feature
    // is not something to discover from the Play Store.
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.endsWith('Release') }) {
            throw new GradleException(
                "android/app/google-services.json is missing.\n" +
                "Push notifications cannot work in a release build without it. " +
                "Download it from the Firebase console (project lopay-auth, Android app " +
                "com.lopay.app) and place it at android/app/google-services.json.")
        }
    }
    logger.lifecycle("WARNING: google-services.json not found — push notifications will not work in this build.")
}
