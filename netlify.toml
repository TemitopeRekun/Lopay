# Netlify deployment for the Lopay web client.
#
# This repo builds a Vite SPA into `dist/`. There is no server side here — all
# money logic lives in lopay-backend, which the browser calls directly over
# CORS. So this file only has to do three things: build, route, and set the
# headers a static host is responsible for.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the CI + local toolchain (see .github/workflows/ci.yml).
  NODE_VERSION = "22"

  # VITE_* vars are read at BUILD time and baked into the bundle — changing one
  # in the Netlify UI requires a redeploy, not just a restart.
  #
  # This is set here rather than only in the UI on purpose: `.env*` is
  # gitignored, so without a value the build would silently fall back to
  # http://localhost:3001 and ship a bundle (and a CSP) pointing at localhost.
  # It is a public API origin, not a secret. A Netlify UI variable of the same
  # name overrides this.
  VITE_API_URL = "https://lopay-backend.onrender.com"

  # Receipt uploads do NOT pass through the API. The backend mints a Supabase
  # signed upload URL and the browser PUTs the file straight to this origin, so
  # it has to be in the CSP's `connect-src` or every upload dies as an opaque
  # "Failed to fetch" that `vite dev` (which injects no CSP) cannot reproduce.
  # Must match the backend's SUPABASE_URL. Not a secret — the project URL is
  # public; the service-role key that grants access to it is what stays server
  # side. The build fails if this is unset (see vite.config.ts).
  VITE_SUPABASE_URL = "https://kmrfnbvkzauiaseslblt.supabase.co"

  # ---------------------------------------------------------------------------
  # Firebase Cloud Messaging (web push)
  # ---------------------------------------------------------------------------
  # Read from Firebase project `lopay-auth` (app "Lopay Web") via the Firebase
  # management API — not transcribed by hand.
  #
  # Hardcoded here for the same reason VITE_API_URL is: `.env*` is gitignored, so
  # a value that lives only in the Netlify UI is one forgotten setting away from
  # a build that silently ships without push. Unlike the API URL these do not
  # vary by deploy context — there is one Firebase project — so they sit in
  # [build.environment] only and every context inherits them. A Netlify UI
  # variable of the same name still overrides, which is the escape hatch if a
  # second project is ever introduced.
  #
  # projectId MUST stay `lopay-auth`: it is the project the backend's service
  # account belongs to, and a token minted against any other project is accepted
  # by FCM and then never delivered.
  #
  # None of these is a secret — the web config is designed to ship to browsers,
  # and the API key below is inlined into the JS bundle every visitor downloads
  # regardless of where it is stored. The credential that can SEND a push is the
  # backend's FIREBASE_PRIVATE_KEY and must never appear here.
  #
  # "Not a secret" is not the same as "harmless", though: an API key that carries
  # no RESTRICTION is usable against every API enabled in project 891944287716,
  # which includes Identity Toolkit. GitHub secret scanning flags this line
  # (alert #1, open since 2026-02-07) and it is right to. What makes the key safe
  # is an application + API restriction in Google Cloud Console, not secrecy —
  # see §2.5 of lopay-backend/docs/push-notifications.md before touching this.
  VITE_FIREBASE_API_KEY = "AIzaSyAOBO038w5ORRnBBS-mDIfG35qVvyrJ1As"
  VITE_FIREBASE_AUTH_DOMAIN = "lopay-auth.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "lopay-auth"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "891944287716"
  VITE_FIREBASE_APP_ID = "1:891944287716:web:e79cf39ed1fcc6d60e1bf1"

  # Web Push certificate (VAPID) public key, generated in the Firebase console —
  # the one value with no API or CLI behind it. Public by design: the private
  # half never leaves Google.
  #
  # Verified end-to-end on 2026-08-08: a headless Chromium against this config
  # minted a real FCM token whose push subscription reported this exact key as
  # its applicationServerKey, and a push sent with the backend service account
  # was delivered to it.
  #
  # Do not drop it and rely on the SDK's built-in default key — the Firebase JS
  # SDK docs state that push services including Chrome's require a non-default one.
  VITE_FIREBASE_VAPID_KEY = "BFg2Dh6-565PwjX5FLrQHjQPvW9OMk-EXdqvIIXGsIKfe6IrBgk8YWjD4Epbr7ciw629M5BFzQ6f-JZ7XwH_wIE"

# `production` is whatever the site's production branch is set to — `main` for
# this repo. That branch selection lives in the Netlify UI (Site configuration →
# Build & deploy → Continuous deployment), not here; netlify.toml has no key for
# it. Every push to main, including a squashed PR merge, builds and publishes
# automatically so long as auto-publish stays enabled.
[context.production.environment]
  VITE_API_URL = "https://lopay-backend.onrender.com"
  VITE_SUPABASE_URL = "https://kmrfnbvkzauiaseslblt.supabase.co"

# Deploy previews and branch deploys build against the same staging API. They
# get their own blocks so pointing production at a live API later is a one-line
# change that the previews cannot accidentally follow.
[context.deploy-preview.environment]
  VITE_API_URL = "https://lopay-backend.onrender.com"
  VITE_SUPABASE_URL = "https://kmrfnbvkzauiaseslblt.supabase.co"

[context.branch-deploy.environment]
  VITE_API_URL = "https://lopay-backend.onrender.com"
  VITE_SUPABASE_URL = "https://kmrfnbvkzauiaseslblt.supabase.co"

# ---------------------------------------------------------------------------
# SPA routing
# ---------------------------------------------------------------------------
# react-router owns every path. Without this, a hard refresh or a shared link
# to e.g. /dashboard hits the CDN, finds no such file, and 404s.
# Existing files (assets, manifest.json) still win over this rule, so it does
# not shadow real static content.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
# The full Content-Security-Policy is injected as a <meta http-equiv> at build
# time from VITE_API_URL (see build/csp.ts + vite.config.ts) so that the native
# Capacitor shell — which has no HTTP server in front of it — gets the same
# policy as the web build. Only the directives a meta tag CANNOT express are
# sent as real headers here.
#
# A second CSP is enforced independently of the meta one; because this policy
# declares only frame-ancestors, it restricts only framing and leaves the meta
# policy's script/style/connect rules untouched.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Deny the ambient device APIs the app never uses. Deliberately NOT listed:
    # `camera` (receipt capture) and `payment` (the Payment Request API backs
    # Apple/Google Pay inside Paystack checkout) — denying either breaks a real
    # flow.
    Permissions-Policy = "geolocation=(), microphone=(), usb=(), magnetometer=(), gyroscope=()"
    # includeSubDomains is safe on *.netlify.app. Revisit it when a custom
    # apex domain is attached — it would force HTTPS on every sibling subdomain.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Cross-Origin-Opener-Policy would break the Paystack checkout popup's
    # window.opener handshake, so it is deliberately absent.

# Vite fingerprints everything under /assets, so those URLs are immutable.
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is the only unhashed entry point — it must be revalidated or
# clients keep loading a stale asset manifest after a deploy.
[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The FCM background worker. Two rules, both load-bearing:
#
#   - It must NOT be cached. A stale worker keeps running for as long as the
#     cache says it is fresh, so a Firebase config change (or a fix in the
#     background handler) would not reach devices that already registered.
#     Browsers cap SW script caching at 24h regardless, but relying on that
#     leaves up to a day of drift.
#   - Service-Worker-Allowed lets the script claim the root scope it registers
#     with in webPush.ts. Netlify serves it from `/` already, so this is belt
#     and braces against a future move under /assets.
[[headers]]
  for = "/firebase-messaging-sw.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Icons and the notification chime are content-addressed by name, not hashed by
# Vite (they live in public/ and are referenced by fixed path from the manifest,
# the service worker and the Android channel). They change only when the brand
# does, so a long cache with revalidation on deploy is right.
[[headers]]
  for = "/icons/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sounds/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"
