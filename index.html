<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#4A90E2" />
    <title>LOPAY - School Fee Payments</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Material Symbols is self-hosted and subsetted (public/fonts/, built from
      build/icon-names.mjs) rather than linked from fonts.googleapis.com, which
      served the full 4 MB variable font with every icon Google ships.

      Preloaded because a webfont is otherwise not requested until an element
      actually uses it — and the first icons live inside lazily-imported routes
      (WelcomeScreen / AuthScreen), so the download only began after those chunks
      mounted. Starting it here overlaps the font with the JS bundle instead.
    -->
    <link
      rel="preload"
      href="/fonts/material-symbols-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      No third-party CDN import map. react / react-dom / react-router-dom are
      bundled locally from node_modules by Vite (see package.json deps). The old
      map pulled them (plus an unused AI SDK) from public CDNs — a supply-chain
      risk that is also disallowed by the SPA CSP (script-src 'self').
    -->
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark font-display antialiased transition-colors duration-200"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
